<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>DIO Agent - Transcrição</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 340px;
      padding: 16px;
      background-color: #121214;
      color: #e1e1e6;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #29292e;
      padding-bottom: 10px;
    }
    .logo-badge {
      background: linear-gradient(135deg, #e4105d, #7928ca);
      color: white;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 13px;
    }
    .header h1 {
      font-size: 15px;
      color: #ffffff;
      font-weight: 600;
    }
    .status-card {
      background: #202024;
      border: 1px solid #29292e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.4;
    }
    .status-title {
      font-weight: 600;
      color: #a8a8b3;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .status-text {
      color: #e1e1e6;
      word-break: break-word;
    }
    .preview-box {
      max-height: 100px;
      overflow-y: auto;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      color: #a1a1aa;
      white-space: pre-wrap;
      margin-top: 8px;
      display: none;
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      background: linear-gradient(135deg, #e4105d, #a81c7e);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn:disabled {
      background: #323238;
      color: #7c7c8a;
      cursor: not-allowed;
    }
    .footer {
      margin-top: 10px;
      font-size: 11px;
      color: #7c7c8a;
      text-align: center;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo-badge">DIO</span>
    <h1>Capturador de Aulas</h1>
  </div>

  <div class="status-card">
    <div class="status-title">Status da Aula</div>
    <div id="status-text" class="status-text">Pronto para capturar a aula aberta na aba atual.</div>
    <div id="preview-box" class="preview-box"></div>
  </div>

  <button id="capture-btn" class="btn">
    <span id="btn-text">Capturar e Copiar Transcrição</span>
  </button>

  <div class="footer">
    Cole com Ctrl+V no chat com o DIO Agent
  </div>

  <script src="popup.js"></script>
</body>
</html>
